<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AS-Social | Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at top left,
                    #ffe4ef,
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    #e4e7ff,
                    transparent 40%
                ),
                #f7f7fb;

            font-family: Arial, sans-serif;
        }


        .auth-box {

            width: 100%;
            max-width: 420px;

            padding: 32px 26px;

            background: rgba(
                255,
                255,
                255,
                .97
            );

            border-radius: 24px;

            box-shadow:
                0 18px 50px
                rgba(0,0,0,.12);

            text-align: center;
        }


        .auth-logo {

            width: 72px;
            height: 72px;

            margin:
                0 auto 16px;

            border-radius: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #8c1d40,
                    #d62f70
                );

            color: white;

            font-size: 28px;

            font-weight: 900;

            box-shadow:
                0 10px 25px
                rgba(140,29,64,.25);
        }


        h2 {

            margin:
                0 0 7px;

            font-size: 28px;
        }


        .subtitle {

            color: #777;

            margin-bottom: 22px;
        }


        input {

            width: 100%;

            padding: 14px;

            margin: 7px 0;

            border:
                1px solid #ddd;

            border-radius: 12px;

            outline: none;

            font-size: 15px;
        }


        input:focus {

            border-color:
                #8c1d40;

            box-shadow:
                0 0 0 3px
                rgba(140,29,64,.08);
        }


        button {

            width: 100%;

            border: none;

            padding: 14px;

            margin-top: 12px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 15px;

            font-weight: 700;
        }


        #loginBtn {

            background:
                #8c1d40;

            color: white;
        }


        #magicLinkBtn {

            background:
                #f3edf0;

            color:
                #8c1d40;
        }


        button:disabled {

            opacity: .6;

            cursor:
                not-allowed;
        }


        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin:
                20px 0 5px;

            color: #aaa;

            font-size: 13px;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #eee;
        }


        #message {

            min-height: 22px;

            margin:
                18px 0 10px;

            font-size: 14px;

            font-weight: 600;
        }


        .create-account {

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid #eee;

            font-size: 14px;

            color: #777;
        }


        .create-account a {

            color:
                #8c1d40;

            font-weight: 700;

            text-decoration: none;
        }


        .back-home {

            display: inline-block;

            margin-top: 15px;

            color: #777;

            text-decoration: none;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="auth-box">


    <div class="auth-logo">
        AS
    </div>


    <h2>
        Welcome Back 👋
    </h2>


    <p class="subtitle">
        Login to your AS-Social account
    </p>


    <input
        type="email"
        id="email"
        placeholder="📧 Email address"
        autocomplete="email"
    >


    <input
        type="password"
        id="password"
        placeholder="🔐 Password"
        autocomplete="current-password"
    >


    <button
        type="button"
        id="loginBtn"
    >
        🔐 Login
    </button>


    <div class="divider">
        OR
    </div>


    <button
        type="button"
        id="magicLinkBtn"
    >
        ✉️ Login with Email Link
    </button>


    <p id="message"></p>


    <div class="create-account">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </div>


    <a
        href="index.html"
        class="back-home"
    >
        ← Back to AS-Social
    </a>


</div>


<script
    type="module"
    src="js/auth.js"
></script>


</body>

</html>
