<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AS-Social</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #ffe5ef,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #e5e9ff,
                    transparent 35%
                ),
                #f7f7fb;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .welcome-box {

            width: 100%;
            max-width: 430px;

            background: rgba(255,255,255,.97);

            padding: 40px 28px;

            border-radius: 28px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(0,0,0,.12);
        }

        .logo {

            width: 78px;
            height: 78px;

            margin: 0 auto 18px;

            border-radius: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            color: white;

            font-size: 30px;
            font-weight: 800;

            box-shadow:
                0 10px 25px rgba(124,58,237,.25);
        }

        h1 {

            font-size: 30px;
            color: #222;

            margin-bottom: 10px;
        }

        .tagline {

            color: #777;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        .btn {

            display: block;

            width: 100%;

            padding: 15px;

            margin-top: 14px;

            border-radius: 14px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 700;

            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .login-btn {

            background: #7c3aed;

            color: white;
        }

        .signup-btn {

            background: white;

            color: #7c3aed;

            border: 2px solid #7c3aed;
        }

        .developer {

            margin-top: 28px;

            padding-top: 18px;

            border-top: 1px solid #eee;

            color: #888;

            font-size: 13px;

            line-height: 1.7;
        }

        .developer strong {
            color: #7c3aed;
        }

        @media(max-width:480px) {

            .welcome-box {
                padding: 35px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }

    </style>

</head>

<body>

    <main class="welcome-box">

        <div class="logo">
            AS
        </div>

        <h1>
            Welcome to AS-Social
        </h1>

        <p class="tagline">
            Connect with people, share posts,
            chat with friends and build your
            social circle.
        </p>

        <a
            href="login.html"
            class="btn login-btn">

            🔐 Login

        </a>

        <a
            href="signup.html"
            class="btn signup-btn">

            ✨ Create Account

        </a>

        <div class="developer">

            Developer by
            <strong>
                Ishawar Chand alias Laddu
            </strong>

            <br>

            📱 7068387699

        </div>

    </main>

</body>

</html>
