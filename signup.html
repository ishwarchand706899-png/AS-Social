<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AS Social - Sign Up</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<div class="auth-box">

    <div class="logo">AS</div>

    <h2>Create Account</h2>

    <p>Join AS Social</p>

    <input
        type="text"
        id="name"
        placeholder="Full Name">

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button
        class="btn"
        id="signupBtn">
        Create Account
    </button>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script
    type="module"
    src="js/auth.js">
</script>

</body>
</html>
